name: Build Android APK (Rust + Python)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-rust:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Ekstrak & Siapkan Struktur Folder Otomatis
        run: |
          if [ -f "ZCore-Bench-Full-Repo.zip" ]; then
            unzip -o ZCore-Bench-Full-Repo.zip -d temp_extract
            cp -rn temp_extract/* ./ || true
            rm -rf temp_extract
          fi
          mkdir -p rust_core/src app/android_bridge app/assets
          find . -maxdepth 4 -name "Cargo.toml" ! -path "./rust_core/Cargo.toml" -exec mv -f {} rust_core/ \;
          find . -maxdepth 4 -name "pyproject.toml" ! -path "./rust_core/pyproject.toml" -exec mv -f {} rust_core/ \;
          find . -maxdepth 4 -name "lib.rs" ! -path "./rust_core/src/lib.rs" -exec mv -f {} rust_core/src/ \;
          find . -maxdepth 4 -name "main.py" ! -path "./app/main.py" -exec mv -f {} app/ \;
          for f in permissions.py shizuku_bridge.py device_advisor.py overlay_service.py __init__.py; do
            find . -maxdepth 4 -name "$f" ! -path "./app/android_bridge/$f" -exec mv -f {} app/android_bridge/ \;
          done
          for rootfile in buildozer.spec requirements.txt; do
            find . -maxdepth 4 -name "$rootfile" ! -path "./$rootfile" -exec mv -f {} ./ \;
          done

      - name: Install Rust Toolchain & Android ARM64 Target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Setup Android NDK r25b
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r25b

      - name: Compile Rust Core (.so) for Android arm64-v8a
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          TOOLCHAIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          SYSROOT_LIB="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/26"
          export PATH="$TOOLCHAIN:$PATH"
          export CC_aarch64_linux_android="$TOOLCHAIN/aarch64-linux-android26-clang"
          export AR_aarch64_linux_android="$TOOLCHAIN/llvm-ar"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$TOOLCHAIN/aarch64-linux-android26-clang"
          export PYO3_CROSS=1
          export PYO3_CROSS_PYTHON_VERSION=3.10
          export PYO3_NO_PYTHON=1
          export RUSTFLAGS="-C link-arg=-Wl,--allow-shlib-undefined -L native=$SYSROOT_LIB"

          "$TOOLCHAIN/aarch64-linux-android26-clang" -shared -x c /dev/null -o "$SYSROOT_LIB/libpython3.10.so"

          cd rust_core
          rm -f Cargo.lock
          sed -i 's/features = \["extension-module"\]/features = ["abi3-py310"]/' Cargo.toml
          cargo build --release --target aarch64-linux-android
          cp target/aarch64-linux-android/release/libzcore_bench_engine.so ../app/assets/libzcore_bench_engine.so

      - name: Upload Prepared Workspace
        uses: actions/upload-artifact@v4
        with:
          name: prepared-workspace
          path: |
            app/
            buildozer.spec
            requirements.txt

  build-apk:
    needs: build-rust
    runs-on: ubuntu-22.04
    container:
      image: kivy/buildozer:latest
      options: --user root
    steps:
      - name: Download Prepared Workspace
        uses: actions/download-artifact@v4
        with:
          name: prepared-workspace

      - name: Build Debug APK
        run: |
          mkdir -p bin
          sed -i "s|requirements = .*|requirements = python3,kivy==2.3.0,kivymd==1.1.1,pillow,pyjnius|g" buildozer.spec
          sed -i "s|android.api = 34|android.api = 33|g" buildozer.spec
          sed -i "s|warn_on_root = 1|warn_on_root = 0|g" buildozer.spec
          sed -i '/\[app\]/a android.accept_sdk_license = True' buildozer.spec
          buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZCore-Bench-APK
          path: bin/*.apk
